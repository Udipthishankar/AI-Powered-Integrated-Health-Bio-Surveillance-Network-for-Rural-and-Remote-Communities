
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>District Command Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📊 District Command Center</h1>
        <p>Real-Time Health Surveillance Grid</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="field-worker.html">Field Entry</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="analytics.html">Analytics</a>
        <a href="telehealth.html">Telehealth</a>
    </nav>
    <div class="container">
        <div class="stats-container">
            <div class="stat-box">Total Screened Patients<span id="totalCount">0</span></div>
            <div class="stat-box alert-box">High-Risk Health Alerts<span id="highRiskCount">0</span></div>
        </div>
        <section class="card">
            <h2>Live Patient Records Log</h2>
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Name & Age</th>
                        <th>Location</th>
                        <th>Vitals</th>
                        <th>Risk Status</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </section>
    </div>
    <script>
        async function loadData() {
            const statsRes = await fetch('/api/stats');
            const stats = await statsRes.json();
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('highRiskCount').textContent = stats.highRisk;

            const patRes = await fetch('/api/patients');
            const patients = await patRes.json();
            const tbody = document.getElementById('patientTableBody');
            tbody.innerHTML = '';
            patients.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.timestamp}</td>
                        <td><b>${p.name}</b> (${p.age})</td>
                        <td>${p.location}</td>
                        <td>${p.temperature}°C, ${p.heartRate} BPM</td>
                        <td><span class="badge-${p.riskLevel}">${p.riskLevel} Risk</span></td>
                    </tr>
                `;
            });
        }
        loadData();
        setInterval(loadData, 5000); // Auto-refresh every 5 seconds
    </script>
</body>
</html>
